<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Jadwal Taklim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald: #123A5C;
      --emerald-dark: #0A2A44;
      --emerald-light: #1C5A87;
      --gold: #C9A227;
      --gold-soft: #F1E4B8;
      --sand: #FAF6EC;
      --ink: #1C2B22;
      --ink-soft: #5B6B60;
      --sage: #DCE7DD;
      --clay: #A8492F;
      --ok: #1E7B4A;
      --white: #FFFFFF;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(15, 81, 50, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--sand);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: 'Amiri', serif; }

    header.top {
      background: linear-gradient(135deg, var(--emerald-dark), var(--emerald));
      color: var(--white);
      padding: 36px 24px 0;
      text-align: center;
    }
    .brand-eyebrow {
      letter-spacing: 3px; font-size: 11px; text-transform: uppercase;
      color: var(--gold-soft); font-weight: 700; margin-bottom: 8px;
    }
    header.top h1 { font-size: clamp(24px, 4vw, 34px); margin: 0 0 6px; font-weight: 700; }
    header.top p { margin: 0 0 28px; color: rgba(255,255,255,0.82); font-size: 14.5px; }
    .arch-divider { display: block; width: 100%; height: 34px; }

    main { max-width: 1120px; margin: -2px auto 60px; padding: 0 20px; }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 20px;
    }
    .card.narrow { max-width: 820px; margin-left: auto; margin-right: auto; }
    .section-title {
      font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold); font-weight: 800; margin: 0 0 4px;
    }
    .section-heading {
      font-size: 19px; margin: 0 0 18px; color: var(--emerald-dark); font-weight: 700;
      padding-bottom: 14px; border-bottom: 1px solid var(--sage);
    }

    .top-actions {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .link-btn {
      color: var(--emerald); font-weight: 700; font-size: 13.5px; text-decoration: none;
      border: 1.5px solid var(--emerald); padding: 9px 16px; border-radius: 10px; background: var(--white);
      cursor: pointer; font-family: inherit;
    }
    .link-btn:hover { background: var(--emerald); color: var(--white); }

    /* ===== Tabs ===== */
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab-btn {
      padding: 11px 20px; border-radius: 10px; border: 1.5px solid var(--sage);
      background: var(--white); color: var(--ink-soft); font-weight: 700; font-size: 14px;
      font-family: inherit; cursor: pointer;
    }
    .tab-btn:hover { border-color: var(--emerald); color: var(--emerald-dark); }
    .tab-btn.active { background: var(--emerald-dark); border-color: var(--emerald-dark); color: var(--white); }

    /* ===== Form ===== */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
    .full { grid-column: 1 / -1; }
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .card { padding: 20px; }
    }
    label {
      display: block; font-size: 12.5px; font-weight: 700; color: var(--emerald-dark); margin-bottom: 6px;
    }
    label .req { color: var(--clay); }
    label .hint { font-weight: 500; color: var(--ink-soft); }

    input[type=text], input[type=tel], input[type=password], select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--sage);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: var(--sand);
      color: var(--ink);
    }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--emerald); background: var(--white);
      box-shadow: 0 0 0 3px rgba(18, 58, 92, 0.12);
    }
    select:disabled { opacity: 0.6; cursor: not-allowed; }

    .edit-banner {
      display: none; background: var(--gold-soft); color: var(--emerald-dark);
      border-radius: 10px; padding: 11px 16px; font-size: 13.5px; font-weight: 700; margin-bottom: 18px;
    }
    .edit-banner.show { display: block; }

    .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .btn-primary {
      background: var(--emerald); color: var(--white); border: none;
      padding: 13px 26px; border-radius: 10px; font-weight: 800; font-size: 14.5px;
      font-family: inherit; cursor: pointer;
    }
    .btn-primary:hover:not(:disabled) { background: var(--emerald-dark); }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }
    .btn-secondary {
      background: var(--white); color: var(--ink-soft); border: 1.5px solid var(--sage);
      padding: 13px 22px; border-radius: 10px; font-weight: 700; font-size: 14.5px;
      font-family: inherit; cursor: pointer;
    }
    .btn-secondary:hover { border-color: var(--emerald); color: var(--emerald-dark); }

    .alert {
      display: none; border-radius: 10px; padding: 12px 16px; font-size: 13.5px;
      font-weight: 600; margin-bottom: 18px;
    }
    .alert.show { display: block; }
    .alert.success { background: #E3F1E9; color: var(--ok); border: 1px solid #BFE0CC; }
    .alert.error { background: #FBE9E4; color: var(--clay); border: 1px solid #F0C9BD; }

    /* ===== Kelola (tabel) ===== */
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar .search-box { flex: 1; min-width: 200px; }
    .toolbar select { flex: 0 0 180px; width: auto; }
    @media (max-width: 720px) { .toolbar select { flex: 1 1 45%; } }

    .result-info {
      font-size: 13px; color: var(--emerald-dark); background: var(--gold-soft);
      border-radius: 10px; padding: 9px 14px; margin-bottom: 16px; font-weight: 600;
    }
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--sage); }
    .table-wrap::-webkit-scrollbar { height: 9px; }
    .table-wrap::-webkit-scrollbar-track { background: var(--sage); border-radius: 10px; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--emerald); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 1050px; }
    thead th {
      background: var(--emerald); color: var(--white); text-align: left;
      padding: 12px 14px; font-weight: 700; white-space: nowrap;
    }
    tbody td { padding: 11px 14px; border-bottom: 1px solid var(--sage); vertical-align: top; }
    tbody tr:nth-child(even) { background: #FBFAF5; }
    tbody tr:hover { background: var(--gold-soft); }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11.5px;
      font-weight: 700; background: #E3F1E9; color: var(--emerald-dark); white-space: nowrap;
    }
    .row-actions { display: flex; gap: 6px; white-space: nowrap; }
    .edit-btn, .del-btn {
      background: none; border-radius: 8px; padding: 5px 11px; font-size: 12px;
      cursor: pointer; font-weight: 700; font-family: inherit;
    }
    .edit-btn { border: 1px solid var(--emerald); color: var(--emerald); }
    .edit-btn:hover { background: var(--emerald); color: var(--white); }
    .del-btn { border: 1px solid var(--clay); color: var(--clay); }
    .del-btn:hover { background: var(--clay); color: var(--white); }
    .del-btn:disabled, .edit-btn:disabled { opacity: 0.5; cursor: wait; }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--ink-soft); }
    .empty-state .icon { font-size: 34px; margin-bottom: 10px; }

    .pagination-wrap {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 20px 4px 4px; flex-wrap: wrap; border-top: 1px solid var(--sage); margin-top: 16px;
    }
    .page-btn {
      min-width: 40px; height: 40px; padding: 0 12px; border-radius: 10px;
      border: 1.5px solid var(--sage); background: var(--white); color: var(--ink);
      font-weight: 700; font-size: 14px; font-family: inherit; cursor: pointer;
    }
    .page-btn:hover:not(:disabled):not(.active) { border-color: var(--emerald); background: var(--gold-soft); }
    .page-btn.active { background: var(--emerald-dark); border-color: var(--emerald-dark); color: var(--white); }
    .page-btn:disabled { color: #C7CFC9; cursor: not-allowed; }
    .page-ellipsis { min-width: 24px; text-align: center; color: var(--ink-soft); font-weight: 700; }

    /* ===== Halaman akses admin ===== */
    .login-card {
      max-width: 570px; margin: 34px auto 20px; background: var(--white);
      border-radius: 18px; box-shadow: 0 18px 40px rgba(10, 42, 68, 0.10);
      padding: 42px 42px 48px; text-align: center;
    }
    .login-card .section-title { margin-bottom: 8px; }
    .login-card .section-heading { margin-bottom: 36px; font-size: 22px; }
    .login-card input[type=password] {
      background: var(--white); padding: 16px 18px; font-size: 15.5px;
      border-radius: 12px; margin-bottom: 18px;
    }
    .btn-block { width: 100%; padding: 17px; border-radius: 12px; font-size: 16px; }
    @media (max-width: 640px) {
      .login-card { padding: 30px 22px 34px; margin-top: 22px; }
    }

    footer { text-align: center; color: var(--ink-soft); font-size: 12.5px; padding-bottom: 30px; }
  </style>
</head>
<body>

  <header class="top">
    <div class="brand-eyebrow">DPD Wahdah Islamiyah Makassar</div>
    <h1>Halaman Admin Jadwal Taklim</h1>
    <p>Input, edit, dan hapus jadwal taklim wilayah Makassar, Gowa &amp; Maros</p>
    <svg class="arch-divider" viewBox="0 0 300 50" preserveAspectRatio="none">
      <path fill="#FAF6EC" d="M0,50 V30 Q4,10 50,8 Q96,10 100,30 Q104,10 150,8 Q196,10 200,30 Q204,10 250,8 Q296,10 300,30 V50 Z"/>
    </svg>
  </header>

  <main>
    <!-- ============ HALAMAN AKSES ADMIN ============ -->
    <div id="loginView">
      <div class="login-card">
        <div class="section-title">Akses Admin</div>
        <h2 class="section-heading">Masukkan Password</h2>
        <div class="alert" id="loginAlert"></div>
        <form id="loginForm" autocomplete="off">
          <input type="password" id="loginPass" placeholder="Password admin" autocomplete="current-password">
          <button type="submit" class="btn-primary btn-block" id="loginBtn">Masuk</button>
        </form>
      </div>
    </div>

    <!-- ============ HALAMAN ADMIN (tampil setelah login) ============ -->
    <div id="adminView" style="display:none">
      <div class="top-actions">
        <a class="link-btn" href="index.html">← Lihat Jadwal</a>
        <button type="button" class="link-btn" id="logoutBtn">Keluar</button>
      </div>

      <div class="tabs">
        <button type="button" class="tab-btn active" id="tabInput" onclick="switchTab('input')">＋ Input Jadwal</button>
        <button type="button" class="tab-btn" id="tabManage" onclick="switchTab('manage')">✎ Kelola Jadwal</button>
      </div>

      <div class="alert" id="alertBox"></div>

      <!-- ========== PANEL: INPUT / EDIT ========== -->
      <div id="panelInput">
        <div class="card narrow">
          <div class="section-title" id="formEyebrow">Form Input</div>
          <h2 class="section-heading" id="formHeading">Jadwal Taklim Baru</h2>

          <div class="edit-banner" id="editBanner"></div>

          <form id="jadwalForm" autocomplete="off" novalidate>
            <div class="form-grid">
              <div>
                <label for="pemateri">Pemateri <span class="req">*</span></label>
                <input type="text" id="pemateri" list="pemateriList" placeholder="Nama ustadz / pemateri">
                <datalist id="pemateriList"></datalist>
              </div>
              <div>
                <label for="nohp">No HP <span class="hint">(opsional)</span></label>
                <input type="tel" id="nohp" placeholder="08xxxxxxxxxx" inputmode="tel">
              </div>

              <div class="full">
                <label for="materi">Materi <span class="req">*</span></label>
                <input type="text" id="materi" placeholder="Contoh: Kitab Tauhid">
              </div>

              <div class="full">
                <label for="tempat">Tempat <span class="req">*</span></label>
                <input type="text" id="tempat" placeholder="Contoh: Masjid Al-Markaz">
              </div>

              <div>
                <label for="hari">Hari <span class="req">*</span></label>
                <select id="hari">
                  <option value="">Pilih hari</option>
                  <option>Senin</option>
                  <option>Selasa</option>
                  <option>Rabu</option>
                  <option>Kamis</option>
                  <option>Jumat</option>
                  <option>Sabtu</option>
                  <option>Ahad</option>
                </select>
              </div>
              <div>
                <label for="waktu">Waktu <span class="req">*</span></label>
                <input type="text" id="waktu" placeholder="Contoh: Ba'da Maghrib / 16.00 - 17.30">
              </div>

              <div>
                <label for="kota">Kota <span class="req">*</span></label>
                <select id="kota">
                  <option value="">Pilih kota</option>
                </select>
              </div>
              <div>
                <label for="kecamatan">Kecamatan <span class="req">*</span></label>
                <select id="kecamatan" disabled>
                  <option value="">Pilih kota terlebih dahulu</option>
                </select>
              </div>

              <div class="full">
                <label for="status">Status <span class="hint">(opsional)</span></label>
                <input type="text" id="status" list="statusList" placeholder="Contoh: Aktif">
                <datalist id="statusList"></datalist>
              </div>

              <div class="full">
                <label for="keterangan">Keterangan <span class="hint">(opsional)</span></label>
                <textarea id="keterangan" placeholder="Catatan tambahan, mis. khusus ikhwan / akhwat, mingguan, dll."></textarea>
              </div>
            </div>

            <div class="actions">
              <button type="submit" class="btn-primary" id="submitBtn">Simpan Jadwal</button>
              <button type="button" class="btn-secondary" id="resetBtn">Kosongkan Form</button>
              <button type="button" class="btn-secondary" id="cancelEditBtn" style="display:none">Batal Edit</button>
            </div>
          </form>
        </div>
      </div>

      <!-- ========== PANEL: KELOLA (EDIT & HAPUS) ========== -->
      <div id="panelManage" style="display:none">
        <div class="card">
          <div class="section-title">Kelola Data</div>
          <h2 class="section-heading">Edit &amp; Hapus Jadwal Taklim</h2>

          <div class="toolbar">
            <input type="text" class="search-box" id="manageSearch" placeholder="Cari pemateri, materi, tempat, hari, atau kecamatan..." style="width:auto">
            <select id="manageKota">
              <option value="">Semua Kota</option>
            </select>
            <button type="button" class="link-btn" id="manageRefresh">⟳ Muat Ulang</button>
          </div>

          <div class="result-info" id="manageInfo"></div>
          <div id="manageTable"></div>
          <div class="pagination-wrap" id="managePagination"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>© DPD Wahdah Islamiyah Makassar — Halaman Admin</footer>

  <script>
    /* Samakan dengan API_URL di index.html */
    const API_URL = 'https://script.google.com/macros/s/AKfycbztdgqqBExOsAhIDfqAjCQmoxhFsY368v5mZ9uhXHwvsiID4QC1K8DldH9Dx4SG9fZm/exec';

    const KOTA_LIST = ['Makassar', 'Gowa', 'Maros'];
    const PAGE_SIZE = 50;

    let kecamatanByKota = {};
    let pematerPhone = {};     // nama pemateri -> no hp (dari data yang sudah ada)
    let editing = null;        // { rowIndex, check } saat mode edit
    let manageData = null;     // cache data tab Kelola (null = perlu dimuat ulang)
    let managePage = 1;
    let currentPin = '';
    let adminStarted = false;

    const $ = function (id) { return document.getElementById(id); };

    function esc(val) {
      if (val === undefined || val === null) return '';
      const div = document.createElement('div');
      div.textContent = val;
      return div.innerHTML;
    }

    /* ================= ALERT ================= */
    function showAlert(type, msg) {
      const box = $('alertBox');
      box.className = 'alert show ' + type;
      box.textContent = msg;
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    function hideAlert() { $('alertBox').className = 'alert'; }

    /* ================= API ================= */
    function callApi(action, params) {
      const query = new URLSearchParams(Object.assign({ action: action }, params || {}));
      return fetch(API_URL + '?' + query.toString())
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (data) {
          if (data && data.error) throw new Error(data.message || 'Terjadi kesalahan pada server.');
          return data;
        });
    }

    /* POST sebagai text/plain agar tidak memicu CORS preflight di Apps Script */
    function postApi(payload) {
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (res) {
          if (res && res.error) throw new Error(res.message || 'Terjadi kesalahan pada server.');
          return res;
        });
    }

    /* Jika error karena password salah / sesi habis -> kembali ke halaman akses */
    function handleAuthError(err) {
      if (/password|PIN/i.test(err.message)) {
        logout();
        showLoginAlert('Password salah atau sesi berakhir. Silakan masuk kembali.');
        return true;
      }
      return false;
    }

    /* ================= HELPER FORM ================= */
    function fillOptions(selectEl, items, placeholder) {
      selectEl.innerHTML = '';
      const ph = document.createElement('option');
      ph.value = '';
      ph.textContent = placeholder;
      selectEl.appendChild(ph);
      items.forEach(function (v) {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        selectEl.appendChild(o);
      });
    }

    function fillDatalist(id, values) {
      const dl = $(id);
      dl.innerHTML = '';
      values.forEach(function (v) {
        const o = document.createElement('option');
        o.value = v;
        dl.appendChild(o);
      });
    }

    /* Set nilai <select>; jika nilai belum ada di opsi, tambahkan agar tidak hilang */
    function setSelectValue(sel, val) {
      if (!val) { sel.value = ''; return; }
      let found = false;
      Array.prototype.forEach.call(sel.options, function (o) { if (o.value === val) found = true; });
      if (!found) {
        const o = document.createElement('option');
        o.value = val;
        o.textContent = val;
        sel.appendChild(o);
      }
      sel.value = val;
    }

    function setKotaKecamatan(kota, kec) {
      $('kota').value = kota || '';
      if (!kota) {
        fillOptions($('kecamatan'), [], 'Pilih kota terlebih dahulu');
        $('kecamatan').disabled = true;
        return;
      }
      fillOptions($('kecamatan'), kecamatanByKota[kota] || [], 'Pilih kecamatan');
      $('kecamatan').disabled = false;
      setSelectValue($('kecamatan'), kec || '');
    }

    function resetForm() {
      $('jadwalForm').reset();
      setKotaKecamatan('', '');
    }

    /* ================= INIT DATA (setelah login) ================= */
    function loadSuggestions() {
      callApi('getAllJadwalData', { kota: '' })
        .then(function (rows) {
          const pemateri = {}, status = {};
          rows.forEach(function (r) {
            const p = (r['PEMATERI'] || '').toString().trim();
            const hp = (r['NO HP'] || '').toString().trim();
            const s = (r['STATUS'] || '').toString().trim();
            if (p) { pemateri[p] = true; if (hp && !pematerPhone[p]) pematerPhone[p] = hp; }
            if (s) status[s] = true;
          });
          fillDatalist('pemateriList', Object.keys(pemateri).sort());
          fillDatalist('statusList', Object.keys(status).sort());
        })
        .catch(function () { /* saran bersifat opsional */ });
    }

    function init() {
      fillOptions($('kota'), KOTA_LIST, 'Pilih kota');
      fillOptions($('manageKota'), KOTA_LIST, 'Semua Kota');

      callApi('getKecamatanByKota')
        .then(function (res) { kecamatanByKota = res; })
        .catch(function (err) { showAlert('error', 'Gagal memuat daftar kecamatan: ' + err.message); });

      loadSuggestions();
    }

    /* ================= TAB ================= */
    function switchTab(name) {
      const isInput = name === 'input';
      $('panelInput').style.display = isInput ? 'block' : 'none';
      $('panelManage').style.display = isInput ? 'none' : 'block';
      $('tabInput').classList.toggle('active', isInput);
      $('tabManage').classList.toggle('active', !isInput);
      if (!isInput && manageData === null) loadManage();
    }

    /* ================= FORM: KOTA, PEMATERI, RESET ================= */
    $('kota').addEventListener('change', function () {
      setKotaKecamatan(this.value, '');
    });

    $('pemateri').addEventListener('change', function () {
      const hp = pematerPhone[this.value.trim()];
      if (hp && !$('nohp').value) $('nohp').value = hp;
    });

    $('resetBtn').addEventListener('click', function () {
      resetForm();
      hideAlert();
    });

    /* ================= MODE EDIT ================= */
    function enterEditMode(row) {
      editing = {
        rowIndex: row.rowIndex,
        check: { 'NO': row['NO'], 'PEMATERI': row['PEMATERI'], 'MATERI': row['MATERI'] }
      };

      $('pemateri').value = (row['PEMATERI'] || '').toString();
      $('nohp').value = (row['NO HP'] || '').toString();
      $('materi').value = (row['MATERI'] || '').toString();
      $('tempat').value = (row['TEMPAT'] || '').toString();
      setSelectValue($('hari'), (row['HARI'] || '').toString().trim());
      $('waktu').value = (row['WAKTU'] || '').toString();
      $('keterangan').value = (row['KETERANGAN'] || '').toString();
      $('status').value = (row['STATUS'] || '').toString();
      setKotaKecamatan((row['KOTA'] || '').toString().trim(), (row['KECAMATAN'] || '').toString().trim());

      $('formEyebrow').textContent = 'Form Edit';
      $('formHeading').textContent = 'Edit Jadwal Taklim';
      const banner = $('editBanner');
      banner.textContent = 'Mengedit data No. ' + (row['NO'] === '' ? '(tanpa nomor)' : row['NO']) +
        ' — ' + (row['PEMATERI'] || '') + ' · ' + (row['MATERI'] || '');
      banner.className = 'edit-banner show';
      $('submitBtn').textContent = 'Simpan Perubahan';
      $('resetBtn').style.display = 'none';
      $('cancelEditBtn').style.display = 'inline-block';

      hideAlert();
      switchTab('input');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exitEditMode() {
      editing = null;
      resetForm();
      $('formEyebrow').textContent = 'Form Input';
      $('formHeading').textContent = 'Jadwal Taklim Baru';
      $('editBanner').className = 'edit-banner';
      $('submitBtn').textContent = 'Simpan Jadwal';
      $('resetBtn').style.display = 'inline-block';
      $('cancelEditBtn').style.display = 'none';
    }

    $('cancelEditBtn').addEventListener('click', function () {
      exitEditMode();
      hideAlert();
      switchTab('manage');
    });

    /* ================= SUBMIT (TAMBAH / SIMPAN PERUBAHAN) ================= */
    $('jadwalForm').addEventListener('submit', function (e) {
      e.preventDefault();
      hideAlert();

      const data = {
        'PEMATERI': $('pemateri').value.trim(),
        'NO HP': $('nohp').value.trim(),
        'MATERI': $('materi').value.trim(),
        'TEMPAT': $('tempat').value.trim(),
        'HARI': $('hari').value,
        'WAKTU': $('waktu').value.trim(),
        'KETERANGAN': $('keterangan').value.trim(),
        'KOTA': $('kota').value,
        'KECAMATAN': $('kecamatan').value,
        'STATUS': $('status').value.trim()
      };

      const required = ['PEMATERI', 'MATERI', 'TEMPAT', 'HARI', 'WAKTU', 'KOTA', 'KECAMATAN'];
      for (let i = 0; i < required.length; i++) {
        if (!data[required[i]]) {
          return showAlert('error', 'Kolom ' + required[i] + ' wajib diisi.');
        }
      }

      const isEdit = !!editing;
      const btn = $('submitBtn');
      const idleText = isEdit ? 'Simpan Perubahan' : 'Simpan Jadwal';
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const payload = isEdit
        ? { action: 'updateJadwal', pin: currentPin, rowIndex: editing.rowIndex, check: editing.check, data: data }
        : { action: 'addJadwal', pin: currentPin, data: data };

      postApi(payload)
        .then(function (res) {
          manageData = null; // data tab Kelola perlu dimuat ulang
          if (data['PEMATERI'] && data['NO HP']) pematerPhone[data['PEMATERI']] = data['NO HP'];

          if (isEdit) {
            exitEditMode();
            switchTab('manage');
            showAlert('success', 'Perubahan berhasil disimpan.');
          } else {
            showAlert('success', 'Jadwal berhasil disimpan (No. ' + res.no + ').');
            // Pertahankan kota & kecamatan agar input beruntun lebih cepat
            const kota = data['KOTA'], kec = data['KECAMATAN'];
            resetForm();
            setKotaKecamatan(kota, kec);
          }
        })
        .catch(function (err) {
          if (handleAuthError(err)) return;
          showAlert('error', 'Gagal menyimpan: ' + err.message);
        })
        .then(function () {
          btn.disabled = false;
          btn.textContent = editing ? 'Simpan Perubahan' : 'Simpan Jadwal';
        });
    });

    /* ================= KELOLA: MUAT, FILTER, TABEL ================= */
    function loadManage() {
      $('manageTable').innerHTML = '<div class="empty-state"><div class="icon">⏳</div>Memuat data...</div>';
      $('manageInfo').textContent = '';
      $('managePagination').innerHTML = '';

      callApi('getAllJadwalData', { kota: '' })
        .then(function (rows) {
          manageData = rows;
          managePage = 1;
          renderManage();
        })
        .catch(function (err) {
          $('manageTable').innerHTML =
            '<div class="empty-state"><div class="icon">⚠️</div>Gagal memuat data: ' + esc(err.message) + '</div>';
        });
    }

    function getManageFiltered() {
      const term = ($('manageSearch').value || '').trim().toLowerCase();
      const kota = $('manageKota').value;
      return (manageData || []).filter(function (row) {
        if (kota && (row['KOTA'] || '').toString().trim() !== kota) return false;
        if (!term) return true;
        return ['PEMATERI', 'MATERI', 'TEMPAT', 'HARI', 'KECAMATAN'].some(function (k) {
          return (row[k] || '').toString().toLowerCase().indexOf(term) > -1;
        });
      });
    }

    function renderManage() {
      if (manageData === null) return;
      const filtered = getManageFiltered();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (managePage > totalPages) managePage = totalPages;
      if (managePage < 1) managePage = 1;

      const startIdx = (managePage - 1) * PAGE_SIZE;
      const pageData = filtered.slice(startIdx, startIdx + PAGE_SIZE);

      $('manageInfo').innerHTML = filtered.length
        ? 'Menampilkan baris <strong>' + (startIdx + 1) + '–' + (startIdx + pageData.length) +
          '</strong> dari <strong>' + filtered.length + '</strong> data (total keseluruhan: ' + manageData.length + ').'
        : 'Menampilkan <strong>0</strong> data (total keseluruhan: ' + manageData.length + ').';

      if (!filtered.length) {
        $('manageTable').innerHTML = '<div class="empty-state"><div class="icon">📭</div>Tidak ada jadwal taklim yang cocok.</div>';
        $('managePagination').innerHTML = '';
        return;
      }

      let rows = '';
      pageData.forEach(function (row) {
        rows += '<tr>' +
          '<td>' + esc(row['NO']) + '</td>' +
          '<td>' + esc(row['PEMATERI']) + '</td>' +
          '<td>' + esc(row['MATERI']) + '</td>' +
          '<td>' + esc(row['TEMPAT']) + '</td>' +
          '<td>' + esc(row['HARI']) + '</td>' +
          '<td>' + esc(row['WAKTU']) + '</td>' +
          '<td>' + esc(row['KOTA']) + '</td>' +
          '<td>' + esc(row['KECAMATAN']) + '</td>' +
          '<td>' + (row['STATUS'] ? '<span class="badge">' + esc(row['STATUS']) + '</span>' : '') + '</td>' +
          '<td><div class="row-actions">' +
            '<button type="button" class="edit-btn" onclick="onEditClick(' + row.rowIndex + ')">Edit</button>' +
            '<button type="button" class="del-btn" onclick="onDeleteClick(' + row.rowIndex + ', this)">Hapus</button>' +
          '</div></td>' +
          '</tr>';
      });

      $('manageTable').innerHTML =
        '<div class="table-wrap"><table><thead><tr>' +
        '<th>No</th><th>Pemateri</th><th>Materi</th><th>Tempat</th><th>Hari</th>' +
        '<th>Waktu</th><th>Kota</th><th>Kecamatan</th><th>Status</th><th>Aksi</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>';

      renderManagePagination(totalPages);
    }

    function findRow(rowIndex) {
      return (manageData || []).filter(function (r) { return r.rowIndex === rowIndex; })[0];
    }

    function onEditClick(rowIndex) {
      const row = findRow(rowIndex);
      if (row) enterEditMode(row);
    }

    function onDeleteClick(rowIndex, btn) {
      const row = findRow(rowIndex);
      if (!row) return;

      const label = (row['PEMATERI'] || '') + ' — ' + (row['MATERI'] || '') +
        '\n' + (row['HARI'] || '') + ', ' + (row['KECAMATAN'] || '') + ' (' + (row['KOTA'] || '') + ')';
      if (!confirm('Yakin ingin menghapus jadwal ini?\n\n' + label + '\n\nTindakan ini tidak dapat dibatalkan.')) return;

      hideAlert();
      btn.disabled = true;
      btn.textContent = 'Menghapus...';

      postApi({
        action: 'deleteJadwal',
        pin: currentPin,
        rowIndex: row.rowIndex,
        check: { 'NO': row['NO'], 'PEMATERI': row['PEMATERI'], 'MATERI': row['MATERI'] }
      })
        .then(function () {
          showAlert('success', 'Jadwal berhasil dihapus.');
          loadManage();
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = 'Hapus';
          if (handleAuthError(err)) return;
          showAlert('error', 'Gagal menghapus: ' + err.message);
          // data di sheet kemungkinan berubah; muat ulang agar sinkron
          if (/berubah|tidak ditemukan/i.test(err.message)) loadManage();
        });
    }

    $('manageSearch').addEventListener('input', function () { managePage = 1; renderManage(); });
    $('manageKota').addEventListener('change', function () { managePage = 1; renderManage(); });
    $('manageRefresh').addEventListener('click', function () { loadManage(); });

    /* ================= PAGINATION KELOLA ================= */
    function getPageNumbers(current, total) {
      const delta = 2, range = [], out = [];
      let last;
      for (let i = 1; i <= total; i++) {
        if (i === 1 || i === total || (i >= current - delta && i <= current + delta)) range.push(i);
      }
      range.forEach(function (i) {
        if (last) {
          if (i - last === 2) out.push(last + 1);
          else if (i - last > 2) out.push('...');
        }
        out.push(i);
        last = i;
      });
      return out;
    }

    function renderManagePagination(totalPages) {
      const wrap = $('managePagination');
      if (totalPages <= 1) { wrap.innerHTML = ''; return; }

      let html = '<button type="button" class="page-btn" ' + (managePage === 1 ? 'disabled' : '') +
        ' onclick="goManagePage(' + (managePage - 1) + ')" aria-label="Halaman sebelumnya">&#8249;</button>';

      getPageNumbers(managePage, totalPages).forEach(function (p) {
        if (p === '...') html += '<span class="page-ellipsis">…</span>';
        else html += '<button type="button" class="page-btn' + (p === managePage ? ' active' : '') +
          '" onclick="goManagePage(' + p + ')">' + p + '</button>';
      });

      html += '<button type="button" class="page-btn" ' + (managePage === totalPages ? 'disabled' : '') +
        ' onclick="goManagePage(' + (managePage + 1) + ')" aria-label="Halaman berikutnya">&#8250;</button>';
      wrap.innerHTML = html;
    }

    function goManagePage(p) {
      managePage = p;
      renderManage();
      $('manageTable').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /* ================= AKSES ADMIN (LOGIN) ================= */
    function showLoginAlert(msg) {
      const box = $('loginAlert');
      box.className = 'alert error show';
      box.textContent = msg;
    }
    function hideLoginAlert() { $('loginAlert').className = 'alert'; }

    function showAdmin() {
      $('loginView').style.display = 'none';
      $('adminView').style.display = 'block';
      if (!adminStarted) { adminStarted = true; init(); }
    }

    function showLogin() {
      $('adminView').style.display = 'none';
      $('loginView').style.display = 'block';
      $('loginPass').value = '';
    }

    function logout() {
      currentPin = '';
      manageData = null;
      try { sessionStorage.removeItem('adminPin'); } catch (e) {}
      if (editing) exitEditMode();
      switchTab('input');
      hideAlert();
      showLogin();
    }

    function verifyPin(pin) {
      return postApi({ action: 'verifyPin', pin: pin });
    }

    $('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      hideLoginAlert();
      const pass = $('loginPass').value.trim();
      if (!pass) return showLoginAlert('Password wajib diisi.');

      const btn = $('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Memeriksa...';

      verifyPin(pass)
        .then(function () {
          currentPin = pass;
          try { sessionStorage.setItem('adminPin', pass); } catch (err) {}
          showAdmin();
        })
        .catch(function (err) { showLoginAlert(err.message); })
        .then(function () {
          btn.disabled = false;
          btn.textContent = 'Masuk';
        });
    });

    $('logoutBtn').addEventListener('click', logout);

    // Jika sesi browser masih menyimpan password, verifikasi diam-diam lalu langsung masuk
    (function boot() {
      let saved = '';
      try { saved = sessionStorage.getItem('adminPin') || ''; } catch (e) {}
      if (!saved) return;
      verifyPin(saved)
        .then(function () { currentPin = saved; showAdmin(); })
        .catch(function () { try { sessionStorage.removeItem('adminPin'); } catch (e) {} });
    })();
  </script>
</body>
</html>
